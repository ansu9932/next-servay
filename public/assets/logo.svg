<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 140" role="img" aria-label="next logo">
  <style>
    .word { font-family: 'Arial Black', Impact, 'Poppins', system-ui, sans-serif; font-weight: 900; font-size: 116px; letter-spacing: -7px; }
  </style>

  <!-- full wordmark in ink (reads correctly on every font) -->
  <text x="4" y="106" class="word" fill="#171821">next</text>

  <!-- the final "t" crossbar extended into a forward, slanted green arrow -->
  <g fill="#40CC52">
    <!-- slanted shaft: left edge angled like a / cut -->
    <polygon points="200,39 300,39 300,61 182,61"/>
    <!-- arrowhead pointing forward, past the word -->
    <polygon points="300,27 356,50 300,73"/>
  </g>
</svg>
